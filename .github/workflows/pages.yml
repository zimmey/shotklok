name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android wrapper APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          # Stable key from secrets lets new builds install over old ones;
          # without it a throwaway key is used (uninstall before reinstalling).
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            KEYSTORE_PASS=throwaway
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -alias shotklok \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ShotKlok"
          fi
          android/build.sh "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASS" "$PWD/shotklok.apk"
          rm -rf android/build
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
